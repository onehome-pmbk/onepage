<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รูปข่าวกิจกรรม ONE PAGE</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: {
                        clay: {
                            50: '#faf9f8', 100: '#f5f4f1', 200: '#e8e5df',
                            300: '#d5cfc4', 400: '#b8afa0', 500: '#a39682',
                            600: '#8c7d6b', 700: '#75685a', 800: '#63584e', 900: '#524941',
                        }
                    },
                    boxShadow: {
                        'clay': '8px 8px 16px #d1cfc9, -8px -8px 16px #ffffff',
                        'clay-inset': 'inset 4px 4px 8px #d1cfc9, inset -4px -4px 8px #ffffff',
                        'shelf': '0 12px 10px -5px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                        'book': '2px 4px 12px rgba(0,0,0,0.15)',
                        'book-hover': '4px 12px 20px rgba(0,0,0,0.2)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f5f4f1; }
        .shelf-divider {
            position: relative;
            background: linear-gradient(to bottom, #fdfcfb, #e8e5df);
            height: 18px;
            border-radius: 4px;
            z-index: 10;
        }
        .shelf-divider::before {
            content: ''; position: absolute; top: -2px; left: 2%;
            width: 96%; height: 4px; background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; filter: blur(1px);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-clay-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-clay-50/90 backdrop-blur-md border-b border-clay-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-amber-700 to-amber-900 rounded-xl shadow-clay flex items-center justify-center text-white">
                    <i class="ph-fill ph-books text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-semibold text-amber-900">รูปข่าวกิจกรรม ONE PAGE</h1>
                    <p class="text-xs text-clay-500">คลังเอกสารเผยแพร่</p>
                </div>
            </div>
            <div class="relative w-full md:w-64">
                <input type="text" id="searchInput" placeholder="ค้นหาเอกสาร..." 
                       class="w-full pl-10 pr-4 py-2 bg-white border border-clay-200 rounded-full shadow-inner focus:outline-none focus:ring-2 focus:ring-amber-500/50 text-sm">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-clay-400 text-lg"></i>
            </div>
        </div>
    </header>

    <!-- Breadcrumbs -->
    <div class="bg-clay-100/80 border-b border-clay-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5">
            <nav id="breadcrumb-container" class="flex text-sm text-clay-700 font-medium items-center overflow-x-auto whitespace-nowrap hide-scrollbar">
                <!-- JS will populate -->
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow py-8 px-4 sm:px-6 lg:px-8">
        <!-- ขยาย max-w-6xl เป็น max-w-7xl และลด padding จาก lg:px-16 เป็น lg:px-8 เพื่อเพิ่มพื้นที่ให้เรียง 6 ชิ้นได้ -->
        <div class="max-w-7xl mx-auto bg-clay-50 rounded-2xl shadow-clay-inset p-4 md:p-8 lg:px-8 border border-clay-200 relative overflow-hidden">
            <div class="absolute inset-0 pointer-events-none rounded-2xl shadow-[inset_0_10px_30px_rgba(0,0,0,0.05)]"></div>
            
            <!-- Bookshelf Area -->
            <div id="bookshelf-container" class="relative mt-8 min-h-[300px]"></div>

            <!-- ปุ่มย้อนกลับโฟลเดอร์ก่อนหน้า -->
            <div id="levelBackBtnContainer" class="relative z-20 flex justify-center mt-8 hidden">
                <button onclick="navigateUpTo(currentPath.length - 2)" class="px-6 py-2.5 bg-white border-2 border-clay-300 hover:border-amber-600 hover:bg-amber-50 text-clay-700 hover:text-amber-700 text-sm sm:text-base font-semibold rounded-xl shadow-sm transition-all flex items-center gap-2">
                    <i class="ph-bold ph-arrow-u-up-left text-xl"></i> ย้อนกลับโฟลเดอร์ก่อนหน้า
                </button>
            </div>

            <!-- Pagination Buttons -->
            <div id="pagination-container" class="relative z-20 flex justify-between items-center mt-8 pt-6 border-t border-clay-300/50 hidden">
                <button id="prevPageBtn" onclick="changePage(-1)" class="px-4 py-2 sm:px-6 sm:py-2.5 bg-white border border-clay-300 text-clay-700 text-sm sm:text-base font-medium rounded-xl shadow-sm hover:bg-clay-100 hover:text-amber-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-2">
                    <i class="ph-bold ph-caret-left text-lg"></i> หน้าก่อนหน้า
                </button>
                
                <span id="pageIndicator" class="text-sm sm:text-base font-medium text-clay-600 bg-clay-200/50 px-4 py-1.5 rounded-lg">หน้า 1 / 1</span>
                
                <button id="nextPageBtn" onclick="changePage(1)" class="px-4 py-2 sm:px-6 sm:py-2.5 bg-white border border-clay-300 text-clay-700 text-sm sm:text-base font-medium rounded-xl shadow-sm hover:bg-clay-100 hover:text-amber-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-2">
                    หน้าถัดไป <i class="ph-bold ph-caret-right text-lg"></i>
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-clay-200 py-6 text-center text-clay-600 text-sm">
        <p>© 2026 พัฒนาโดย กลุ่มนโยบายและวิชาการ สนง.พมจ.บึงกาฬ • โทรศัพท์ 042-492463</p>
    </footer>

    <!-- Image Preview Modal -->
    <div id="imageModal" class="fixed inset-0 z-[100] hidden bg-black/80 backdrop-blur-sm transition-opacity duration-300 opacity-0 flex items-center justify-center p-2 sm:p-4">
        <div class="bg-clay-50 rounded-2xl shadow-clay w-fit max-w-[95vw] flex flex-col relative transform scale-95 transition-transform duration-300 max-h-[95vh]" id="modalContent">
            
            <div class="px-4 py-3 border-b border-clay-200 flex justify-between items-center bg-white flex-shrink-0 rounded-t-2xl">
                <h3 id="modalTitle" class="text-clay-800 font-semibold text-lg truncate pr-4 max-w-[250px] md:max-w-md">Preview</h3>
                <button onclick="closePreview()" class="text-clay-500 hover:text-red-500 p-1.5 rounded-full hover:bg-clay-200 transition-colors">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>
            
            <div class="bg-[#f0ece6] relative flex justify-center items-center overflow-hidden p-2 sm:p-4">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none" id="modalLoading">
                    <i class="ph-bold ph-spinner animate-spin text-4xl text-amber-700/50"></i>
                </div>
                <img id="modalImage" src="" alt="Preview" class="w-auto h-auto max-w-[85vw] max-h-[70vh] object-contain relative z-10 hidden shadow-sm rounded-sm" onload="document.getElementById('modalLoading').style.display='none'; this.classList.remove('hidden');">
            </div>
            
            <div class="px-4 sm:px-6 py-4 bg-white flex justify-end gap-3 border-t border-clay-200 flex-shrink-0 rounded-b-2xl">
                <button onclick="closePreview()" class="px-4 py-2 text-sm font-medium text-clay-700 bg-clay-100 border border-clay-300 rounded-lg hover:bg-clay-200 shadow-sm transition-colors">ปิดหน้าต่าง</button>
                <a id="modalDownloadBtn" href="#" target="_blank" class="px-4 sm:px-6 py-2 text-sm font-medium text-white bg-gradient-to-r from-amber-600 to-amber-700 rounded-lg shadow-md hover:shadow-lg hover:from-amber-500 hover:to-amber-600 transition-all flex items-center gap-2 whitespace-nowrap">
                    <i class="ph-bold ph-download-simple"></i> โหลดไฟล์ต้นฉบับ
                </a>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // ----------------------------------------------------------------
        // ใส่ Web App URL ของคุณที่นี่
        const API_URL = "https://script.google.com/macros/s/AKfycbxIKY34bNjxCkDelWoJsjrXGl8g-d_CMxqp2MLKUymShNHakoPZ7hb4dBWKhVg9NYDQ/exec";
        // ----------------------------------------------------------------

        let appData = { tree: {}, items: [] }; 
        let currentPath = []; 
        let currentPathIds = ['root']; 
        
        const container = document.getElementById('bookshelf-container');
        const searchInput = document.getElementById('searchInput');

        let currentPage = 1;
        const itemsPerPage = 24; 

        const thaiMonths = [
            "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
            "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
        ];

        function fixDriveUrls(url) {
            if (!url) return { display: '', download: '' };
            if (url.includes('drive.google.com/uc')) {
                const idMatch = url.match(/id=([^&]+)/);
                if (idMatch && idMatch[1]) {
                    const fileId = idMatch[1];
                    return {
                        display: `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`, 
                        download: `https://drive.google.com/uc?export=download&id=${fileId}`
                    };
                }
            }
            return { display: url, download: url };
        }

        function buildTree(flatData) {
            const tree = {};
            const itemsMap = {};
            flatData.forEach(item => { itemsMap[item.id] = item; });
            flatData.forEach(item => {
                if (item.parentId === 'root') {
                    if (!tree[item.id]) tree[item.id] = { ...item, children: [] };
                } else {
                    const parent = itemsMap[item.parentId];
                    if (parent) {
                        if (!parent.children) parent.children = [];
                        parent.children.push(item);
                    }
                }
            });
            return { tree: flatData.filter(i => i.parentId === 'root'), itemsMap, flatData };
        }

        async function initData() {
            container.innerHTML = `
                <div class="text-center py-32 flex flex-col items-center justify-center">
                    <i class="ph-bold ph-spinner-gap animate-spin text-5xl text-amber-700/80 mb-4"></i>
                    <p class="text-clay-600 font-medium animate-pulse text-lg">กำลังดึงข้อมูล...</p>
                </div>
            `;
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('API Error');
                const flatData = await response.json();
                appData = buildTree(flatData);
                renderView();
            } catch (error) {
                container.innerHTML = `<div class="text-center py-20 text-red-500 font-medium">ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบ URL หรือการแชร์ไฟล์</div>`;
                console.error(error);
            }
        }

        function sortItems(items) {
            return items.sort((a, b) => {
                if (a.type === 'folder' && b.type !== 'folder') return -1;
                if (a.type !== 'folder' && b.type === 'folder') return 1;

                const nameA = a.name;
                const nameB = b.name;

                const monthIndexA = thaiMonths.indexOf(nameA);
                const monthIndexB = thaiMonths.indexOf(nameB);
                if (monthIndexA !== -1 && monthIndexB !== -1) {
                    return monthIndexA - monthIndexB; 
                }

                const numA = parseInt(nameA);
                const numB = parseInt(nameB);
                if (!isNaN(numA) && !isNaN(numB)) {
                    if (numA > 2000 || numB > 2000) return numB - numA; 
                    return numA - numB;
                }

                return nameA.localeCompare(nameB, 'th'); 
            });
        }

        function renderView() {
            updateBreadcrumbs();
            
            const levelBackBtnContainer = document.getElementById('levelBackBtnContainer');
            if (currentPath.length > 0) {
                levelBackBtnContainer.classList.remove('hidden');
            } else {
                levelBackBtnContainer.classList.add('hidden');
            }

            let currentItems = [];
            const currentParentId = currentPathIds[currentPathIds.length - 1];

            if (currentParentId === 'root') {
                currentItems = appData.tree;
            } else {
                currentItems = appData.itemsMap[currentParentId]?.children || [];
            }

            const term = searchInput.value.toLowerCase();
            if (term) {
                currentItems = currentItems.filter(item => item.name.toLowerCase().includes(term));
            }

            currentItems = sortItems(currentItems);

            const totalPages = Math.ceil(currentItems.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = currentItems.slice(startIndex, endIndex);

            renderShelves(paginatedItems);
            updatePaginationUI(totalPages);
        }

        function renderShelves(items) {
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-clay-500 font-medium">โฟลเดอร์ว่างเปล่า หรือไม่พบข้อมูล</div>`;
                return;
            }

            const shelfRow = document.createElement('div');
            shelfRow.className = 'relative w-full';

            // ปรับระยะห่าง gap-x เพื่อให้สัดส่วนการเรียง 6 ชิ้นพอดีบนความกว้างที่ขยายขึ้น
            const itemsContainer = document.createElement('div');
            itemsContainer.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-x-3 lg:gap-x-6 gap-y-10 px-2 sm:px-4 justify-items-center items-end z-20 relative';

            items.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'group flex flex-col items-center w-full max-w-[130px] lg:max-w-[140px] transition-all duration-300 transform';
                
                if (item.type === 'folder') {
                    itemEl.innerHTML = `
                        <div class="relative w-full aspect-[1/1.3] cursor-pointer bg-[#e4d9c5] border-l-[12px] border-amber-700/80 rounded-r-md rounded-l-sm shadow-book group-hover:shadow-book-hover group-hover:-translate-y-2 transition-all flex flex-col items-center justify-center z-20" onclick="navigateTo('${item.id}', '${item.name}')">
                            <i class="ph-fill ph-folder text-5xl text-amber-800/70 mb-3"></i>
                            <h3 class="font-bold text-clay-900 text-center px-2 text-sm leading-tight break-words w-full">${item.name}</h3>
                        </div>
                        <div class="w-[115%] h-2 bg-gradient-to-b from-white to-clay-300 rounded-sm shadow-sm mt-1 z-10"></div>
                    `;
                } else {
                    const urls = fixDriveUrls(item.url);
                    const displayTitle = item.name.replace(/\.[^/.]+$/, "");
                    itemEl.innerHTML = `
                        <div class="relative w-full aspect-[1/1.3] cursor-pointer bg-white p-1.5 pb-6 rounded-sm shadow-book group-hover:shadow-book-hover group-hover:-translate-y-2 transition-all z-20" onclick="openPreview('${item.name}', '${urls.display}', '${urls.download}')">
                            <div class="w-full h-full bg-gray-100 overflow-hidden relative border border-gray-200">
                                <img src="${urls.display}" alt="${item.name}" class="w-full h-full object-cover">
                            </div>
                            <div class="absolute bottom-1 left-0 right-0 text-center px-1">
                                <span class="text-[10px] font-medium text-gray-500 truncate block w-full">${displayTitle}</span>
                            </div>
                        </div>
                        <div class="w-[115%] h-2 bg-gradient-to-b from-white to-clay-300 rounded-sm shadow-sm mt-1 z-10"></div>
                    `;
                }
                itemsContainer.appendChild(itemEl);
            });

            const shelfDivider = document.createElement('div');
            shelfDivider.className = 'shelf-divider shadow-shelf w-full mt-6';
            
            shelfRow.appendChild(itemsContainer);
            shelfRow.appendChild(shelfDivider);
            container.appendChild(shelfRow);
        }

        function updatePaginationUI(totalPages) {
            const paginationContainer = document.getElementById('pagination-container');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            const pageInd = document.getElementById('pageIndicator');

            if (totalPages > 1) {
                paginationContainer.classList.remove('hidden');
                pageInd.innerText = `หน้า ${currentPage} / ${totalPages}`;
                
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;
            } else {
                paginationContainer.classList.add('hidden');
            }
        }

        window.changePage = function(direction) {
            currentPage += direction;
            renderView();
            document.getElementById('bookshelf-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        window.navigateTo = function(id, name) {
            if (id === 'root') {
                currentPath = [];
                currentPathIds = ['root'];
            } else {
                currentPath.push(name);
                currentPathIds.push(id);
            }
            searchInput.value = '';
            currentPage = 1; 
            renderView();
        }

        window.navigateUpTo = function(index) {
            if (index === -1) {
                currentPath = [];
                currentPathIds = ['root'];
            } else {
                currentPath = currentPath.slice(0, index + 1);
                currentPathIds = currentPathIds.slice(0, index + 2);
            }
            searchInput.value = '';
            currentPage = 1; 
            renderView();
        }

        function updateBreadcrumbs() {
            const bc = document.getElementById('breadcrumb-container');
            let html = `<button onclick="navigateUpTo(-1)" class="hover:text-amber-800 transition-colors flex items-center gap-1"><i class="ph-fill ph-house text-lg"></i> หน้าแรก</button>`;
            currentPath.forEach((path, index) => {
                html += `<i class="ph-bold ph-caret-right text-clay-400 text-[10px] mx-2"></i>`;
                html += `<button onclick="navigateUpTo(${index})" class="hover:text-amber-800 transition-colors truncate">${path}</button>`;
            });
            bc.innerHTML = html;
        }

        searchInput.addEventListener('input', () => {
            currentPage = 1; 
            renderView();
        });

        // Modal Logic
        const modal = document.getElementById('imageModal');
        const modalContent = document.getElementById('modalContent');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalDownloadBtn = document.getElementById('modalDownloadBtn');
        const modalLoading = document.getElementById('modalLoading');

        window.openPreview = function(fileName, displayUrl, downloadUrl) {
            modalTitle.innerText = fileName;
            modalLoading.style.display = 'flex';
            modalImage.classList.add('hidden');
            modalImage.src = displayUrl; 
            modalDownloadBtn.href = downloadUrl; 

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            document.body.style.overflow = 'hidden';
        };

        window.closePreview = function() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modalImage.src = '';
                document.body.style.overflow = '';
            }, 300);
        };

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closePreview();
        });

        initData();
    </script>
</body>
</html>
