<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รูปข่าวกิจกรรม ONE PAGE - คลังเอกสารอิเล็กทรอนิกส์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit for modern Thai aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for simple modern icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        // Warm earth tones
                        clay: {
                            50: '#faf9f8',
                            100: '#f5f4f1',
                            200: '#e8e5df',
                            300: '#d5cfc4',
                            400: '#b8afa0',
                            500: '#a39682',
                            600: '#8c7d6b',
                            700: '#75685a',
                            800: '#63584e',
                            900: '#524941',
                        }
                    },
                    boxShadow: {
                        'clay': '8px 8px 16px #d1cfc9, -8px -8px 16px #ffffff',
                        'clay-inset': 'inset 4px 4px 8px #d1cfc9, inset -4px -4px 8px #ffffff',
                        'shelf': '0 12px 10px -5px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                        'book': '2px 4px 12px rgba(0,0,0,0.15)',
                        'book-hover': '4px 12px 20px rgba(0,0,0,0.2)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f5f4f1; }
        /* Custom 3D Shelf styling */
        .shelf-divider {
            position: relative;
            background: linear-gradient(to bottom, #fdfcfb, #e8e5df);
            height: 18px;
            border-radius: 4px;
            margin-bottom: 3rem;
            z-index: 10;
        }
        .shelf-divider::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 2%;
            width: 96%;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            filter: blur(1px);
        }
        /* Book spine shadow effect */
        .book-cover::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.4) 0%, rgba(0,0,0,0.1) 100%);
            border-top-left-radius: 0.25rem;
            border-bottom-left-radius: 0.25rem;
        }
        /* Page edges effect */
        .book-cover {
            border-right: 3px solid #e5e5e5;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #d4d4d4;
        }
        /* Hide scrollbar for breadcrumbs */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-clay-800 antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-clay-50/90 backdrop-blur-md border-b border-clay-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-amber-700 to-amber-900 rounded-xl shadow-clay flex items-center justify-center text-white">
                    <i class="ph-fill ph-books text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-semibold text-amber-900">รูปข่าวกิจกรรม ONE PAGE</h1>
                    <p class="text-xs text-clay-500">คลังเอกสารเผยแพร่</p>
                </div>
            </div>

            <!-- Search and Controls -->
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="relative w-full md:w-64">
                    <input type="text" id="searchInput" placeholder="ค้นหาเอกสาร..." 
                           class="w-full pl-10 pr-4 py-2 bg-white border-none rounded-full shadow-inner focus:outline-none focus:ring-2 focus:ring-amber-500/50 text-sm transition-shadow">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-clay-400 text-lg"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Breadcrumb Navigation -->
    <div class="bg-clay-100/80 border-b border-clay-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5">
            <nav id="breadcrumb-container" class="flex text-sm text-clay-700 font-medium items-center overflow-x-auto whitespace-nowrap hide-scrollbar">
                <!-- Javascript will populate this -->
            </nav>
        </div>
    </div>

    <!-- Main Bookshelf Area -->
    <main class="flex-grow py-8 px-4 sm:px-6 lg:px-8">
        <!-- Bookshelf Cabinet Container -->
        <div class="max-w-6xl mx-auto bg-clay-50 rounded-2xl shadow-clay-inset p-4 md:p-8 lg:px-16 border border-clay-200 relative overflow-hidden min-h-[50vh]">
            <div class="absolute inset-0 pointer-events-none rounded-2xl shadow-[inset_0_10px_30px_rgba(0,0,0,0.05)]"></div>
            <div id="bookshelf-container" class="relative mt-8">
                <!-- Data is rendered here -->
            </div>
        </div>
    </main>

    <footer class="bg-clay-200 py-6 text-center text-clay-600 text-sm">
        <p>© 2026 พัฒนาโดย กลุ่มนโยบายและวิชาการ สนง.พมจ.บึงกาฬ • โทรศัพท์ 042-492463</p>
    </footer>

    <!-- Image Preview Modal -->
    <div id="imageModal" class="fixed inset-0 z-[100] hidden bg-black/80 backdrop-blur-md transition-opacity duration-300 opacity-0 flex items-center justify-center p-4 sm:p-8">
        <div class="bg-clay-50 rounded-2xl shadow-2xl w-full max-w-5xl overflow-hidden flex flex-col relative transform scale-95 transition-transform duration-300" id="modalContent">
            <!-- Header -->
            <div class="px-4 py-3 border-b border-clay-200 flex justify-between items-center bg-white/80">
                <h3 id="modalTitle" class="text-clay-900 font-semibold text-lg truncate pr-4">Preview</h3>
                <button onclick="closePreview()" class="text-clay-500 hover:text-red-500 transition-colors p-1.5 rounded-full hover:bg-clay-200 focus:outline-none">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>
            <!-- Image Container -->
            <div class="bg-gray-900/5 relative flex-grow flex items-center justify-center p-4 min-h-[50vh] max-h-[75vh] overflow-hidden">
                <!-- Loading spinner for image -->
                <div id="imgLoading" class="absolute inset-0 flex items-center justify-center">
                    <i class="ph-bold ph-spinner-gap animate-spin text-4xl text-clay-400"></i>
                </div>
                <img id="modalImage" src="" alt="Preview" class="max-w-full max-h-full object-contain drop-shadow-lg rounded-md relative z-10 transition-opacity duration-300 opacity-0" onload="this.classList.remove('opacity-0'); document.getElementById('imgLoading').style.display='none';">
            </div>
            <!-- Footer Actions -->
            <div class="px-6 py-4 bg-white flex justify-end gap-3 border-t border-clay-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] relative z-20">
                <button onclick="closePreview()" class="px-4 py-2 text-sm font-medium text-clay-700 bg-clay-100 border border-clay-300 rounded-lg hover:bg-clay-200 shadow-sm transition-colors">
                    ปิด
                </button>
                <a id="modalDownloadBtn" href="#" target="_blank" download class="px-6 py-2 text-sm font-medium text-white bg-gradient-to-r from-amber-600 to-amber-700 rounded-lg shadow-md hover:shadow-lg hover:from-amber-500 hover:to-amber-600 transition-all flex items-center gap-2">
                    <i class="ph-bold ph-download-simple"></i>
                    ดาวน์โหลดภาพต้นฉบับ
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript for Data and Interactivity -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxIKY34bNjxCkDelWoJsjrXGl8g-d_CMxqp2MLKUymShNHakoPZ7hb4dBWKhVg9NYDQ/exec";
        const itemsPerShelf = 6; 

        // Node-based state navigation (Supports Unlimited Depth)
        let rootNode = { id: 'root', name: 'หน้าแรก', type: 'folder', children: [] };
        let pathStack = [rootNode]; // Array of nodes currently traversed
        let allNodesMap = { 'root': rootNode };

        const container = document.getElementById('bookshelf-container');
        const searchInput = document.getElementById('searchInput');

        // Fallback Mock Data (Flat array matching Google Apps Script format)
        const mockFlatData = [
            { id: 'f2569', name: '2569', type: 'folder', parentId: 'root' },
            { id: 'f_jan', name: 'มกราคม', type: 'folder', parentId: 'f2569' },
            { id: 'img_test1', name: 'รูปภาพงานวันเด็ก.jpg', type: 'image', parentId: 'f_jan', url: 'https://images.unsplash.com/photo-1543165365-07232ed12fad?auto=format&fit=crop&q=80&w=600' },
            { id: 'f_05', name: '05', type: 'folder', parentId: 'f_jan' },
            { id: 'img_test2', name: 'ลงพื้นที่_1.jpg', type: 'image', parentId: 'f_05', url: 'https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&q=80&w=600' },
            { id: 'f2568', name: '2568', type: 'folder', parentId: 'root' },
            { id: 'f_dec', name: 'ธันวาคม', type: 'folder', parentId: 'f2568' },
            { id: 'img_test3', name: 'ประชุมสิ้นปี.jpg', type: 'image', parentId: 'f_dec', url: 'https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&q=80&w=600' }
        ];

        // 1. Build a Tree from Flat Array
        function buildTree(flatData) {
            rootNode.children = [];
            allNodesMap = { 'root': rootNode };

            // First pass: Create map objects
            flatData.forEach(item => {
                allNodesMap[item.id] = { ...item, children: [] };
            });

            // Second pass: Connect children to parents
            flatData.forEach(item => {
                const node = allNodesMap[item.id];
                const parent = allNodesMap[item.parentId];
                if (parent) {
                    parent.children.push(node);
                } else if (item.parentId === 'root') {
                    rootNode.children.push(node);
                }
            });
        }

        // 2. Sort Nodes intelligently based on level depth
        function sortNodes(nodes, levelDepth) {
            // Separate folders from files
            const folders = nodes.filter(n => n.type === 'folder');
            const files = nodes.filter(n => n.type === 'image' || n.type !== 'folder');

            // Sort Folders
            if (levelDepth === 0) {
                // Root level (Years) -> Descending (2569, 2568)
                folders.sort((a, b) => b.name.localeCompare(a.name, undefined, {numeric: true}));
            } else if (levelDepth === 1) {
                // Month level -> Chronological
                const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
                folders.sort((a, b) => {
                    const iA = thaiMonths.indexOf(a.name);
                    const iB = thaiMonths.indexOf(b.name);
                    if(iA !== -1 && iB !== -1) return iA - iB;
                    return a.name.localeCompare(b.name, undefined, {numeric: true});
                });
            } else {
                // Day level or deeper -> Ascending (01, 02)
                folders.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
            }

            // Sort Files Alphabetically
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

            return [...folders, ...files]; // Folders always come first
        }

        // Initialize fetching data
        async function initData() {
            container.innerHTML = `
                <div class="text-center py-32 flex flex-col items-center justify-center">
                    <i class="ph-bold ph-spinner-gap animate-spin text-5xl text-amber-700/80 mb-4"></i>
                    <p class="text-clay-600 font-medium animate-pulse text-lg">กำลังเชื่อมต่อข้อมูล...</p>
                </div>
            `;

            let rawData = [];
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('API failed');
                rawData = await response.json();
            } catch (error) {
                console.warn('Using Mock Data fallback.');
                rawData = mockFlatData; // fallback
            }

            buildTree(rawData);
            pathStack = [rootNode]; // reset state
            renderCurrentView();
        }

        function renderCurrentView() {
            updateBreadcrumbs();
            
            const currentNode = pathStack[pathStack.length - 1];
            let itemsToRender = sortNodes(currentNode.children, pathStack.length - 1);

            // Simple search filter across children
            const term = searchInput.value.trim().toLowerCase();
            if (term) {
                itemsToRender = itemsToRender.filter(item => item.name.toLowerCase().includes(term));
            }

            renderShelves(itemsToRender);
        }

        function renderShelves(items) {
            container.innerHTML = '';
            
            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-clay-500 font-medium">ไม่มีไฟล์หรือโฟลเดอร์ในหน้านี้</div>`;
                return;
            }

            const numShelves = Math.ceil(items.length / itemsPerShelf) || 1;

            for (let i = 0; i < numShelves; i++) {
                const shelfItems = items.slice(i * itemsPerShelf, (i + 1) * itemsPerShelf);
                
                const shelfRow = document.createElement('div');
                shelfRow.className = 'mb-12 relative';

                const itemsContainer = document.createElement('div');
                itemsContainer.className = 'flex flex-wrap justify-center sm:justify-start md:justify-center gap-6 md:gap-10 px-4 items-end pb-[2px] z-20 relative';

                shelfItems.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'group flex flex-col items-center w-28 sm:w-32 md:w-36 transition-all duration-300 transform';
                    
                    if (item.type === 'folder') {
                        // Render Folder
                        itemEl.innerHTML = `
                            <div class="relative w-full aspect-[1/1.3] cursor-pointer bg-[#e4d9c5] border-l-[12px] border-amber-700/80 rounded-r-md rounded-l-sm shadow-book group-hover:shadow-book-hover group-hover:-translate-y-2 transition-all flex flex-col items-center justify-center z-20" onclick="navigateToNode('${item.id}')">
                                <div class="absolute left-0 top-0 bottom-0 w-[2px] bg-black/10"></div>
                                <i class="ph-fill ph-folder text-5xl text-amber-800/70 mb-3 drop-shadow-sm"></i>
                                <h3 class="font-bold text-clay-900 text-center px-2 text-sm md:text-base leading-tight break-words w-full">${item.name}</h3>
                            </div>
                        `;
                    } else {
                        // Render File (Image) -> Show actual Image URL as cover
                        const imgUrl = item.url || `https://placehold.co/400x560/A0522D/ffffff?text=Image`;
                        const displayName = item.name.replace(/\.[^/.]+$/, ""); // Remove extension for display

                        itemEl.innerHTML = `
                            <div class="relative w-full aspect-[1/1.3] cursor-pointer bg-white p-1.5 pb-6 rounded-sm shadow-book group-hover:shadow-book-hover group-hover:-translate-y-2 transition-all z-20 flex flex-col" onclick="openPreview('${item.name}', '${imgUrl}')">
                                <div class="w-full flex-grow bg-gray-100 overflow-hidden relative border border-gray-200 flex items-center justify-center">
                                    <img src="${imgUrl}" alt="${displayName}" class="w-full h-full object-cover" loading="lazy">
                                </div>
                                <div class="absolute bottom-1 left-0 right-0 text-center px-1">
                                    <span class="text-[10px] font-medium text-gray-500 truncate block">${displayName}</span>
                                </div>
                            </div>
                        `;
                    }
                    itemsContainer.appendChild(itemEl);
                });

                const shelfDivider = document.createElement('div');
                shelfDivider.className = 'shelf-divider shadow-shelf w-full';

                shelfRow.appendChild(itemsContainer);
                shelfRow.appendChild(shelfDivider);
                container.appendChild(shelfRow);
            }
        }

        // Navigation Controller (Node based)
        window.navigateToNode = function(nodeId) {
            const node = allNodesMap[nodeId];
            if (node && node.type === 'folder') {
                pathStack.push(node);
                searchInput.value = '';
                renderCurrentView();
            }
        }

        window.navigateUpTo = function(index) {
            pathStack = pathStack.slice(0, index + 1);
            searchInput.value = '';
            renderCurrentView();
        }

        function updateBreadcrumbs() {
            const bc = document.getElementById('breadcrumb-container');
            let html = '';
            pathStack.forEach((node, index) => {
                if (index > 0) html += `<i class="ph-bold ph-caret-right text-clay-400 text-[10px] mx-2"></i>`;
                const icon = index === 0 ? '<i class="ph-fill ph-house text-lg mr-1"></i> ' : '';
                html += `<button onclick="navigateUpTo(${index})" class="hover:text-amber-800 transition-colors truncate max-w-[120px] sm:max-w-none flex items-center">${icon}${node.name}</button>`;
            });
            bc.innerHTML = html;
        }

        searchInput.addEventListener('input', renderCurrentView);

        // --- Modal Preview Logic ---
        const modal = document.getElementById('imageModal');
        const modalContent = document.getElementById('modalContent');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalDownloadBtn = document.getElementById('modalDownloadBtn');
        const imgLoading = document.getElementById('imgLoading');

        window.openPreview = function(filename, imgUrl) {
            modalTitle.innerText = filename;
            
            // Show loading spinner
            imgLoading.style.display = 'flex';
            modalImage.classList.add('opacity-0');
            modalImage.src = imgUrl;
            
            // Provide exact URL to download button (Google Drive URL)
            modalDownloadBtn.href = imgUrl; 
            modalDownloadBtn.download = filename;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            
            document.body.style.overflow = 'hidden';
        };

        window.closePreview = function() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modalImage.src = '';
                document.body.style.overflow = ''; 
            }, 300);
        };

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closePreview();
        });

        // Init
        initData();

    </script>
</body>
</html>
