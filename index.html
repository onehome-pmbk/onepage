<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รูปข่าวกิจกรรม ONE PAGE - คลังเอกสารอิเล็กทรอนิกส์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit for modern Thai aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for simple modern icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        // Warm earth tones
                        clay: {
                            50: '#faf9f8',
                            100: '#f5f4f1',
                            200: '#e8e5df',
                            300: '#d5cfc4',
                            400: '#b8afa0',
                            500: '#a39682',
                            600: '#8c7d6b',
                            700: '#75685a',
                            800: '#63584e',
                            900: '#524941',
                        }
                    },
                    boxShadow: {
                        'clay': '8px 8px 16px #d1cfc9, -8px -8px 16px #ffffff',
                        'clay-inset': 'inset 4px 4px 8px #d1cfc9, inset -4px -4px 8px #ffffff',
                        'shelf': '0 12px 10px -5px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                        'book': '2px 4px 12px rgba(0,0,0,0.15)',
                        'book-hover': '4px 12px 20px rgba(0,0,0,0.2)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f5f4f1; /* clay-100 */
        }
        /* Custom 3D Shelf styling */
        .shelf-divider {
            position: relative;
            background: linear-gradient(to bottom, #fdfcfb, #e8e5df);
            height: 18px;
            border-radius: 4px;
            margin-bottom: 3rem;
            z-index: 10;
        }
        .shelf-divider::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 2%;
            width: 96%;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            filter: blur(1px);
        }
        /* Book spine shadow effect */
        .book-cover::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.4) 0%, rgba(0,0,0,0.1) 100%);
            border-top-left-radius: 0.25rem;
            border-bottom-left-radius: 0.25rem;
        }
        /* Page edges effect */
        .book-cover {
            border-right: 3px solid #e5e5e5;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #d4d4d4;
        }
        /* Hide scrollbar for breadcrumbs */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-clay-800 antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-clay-50/90 backdrop-blur-md border-b border-clay-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-amber-700 to-amber-900 rounded-xl shadow-clay flex items-center justify-center text-white">
                    <i class="ph-fill ph-books text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-semibold text-amber-900">รูปข่าวกิจกรรม ONE PAGE</h1>
                    <p class="text-xs text-clay-500">คลังเอกสารเผยแพร่</p>
                </div>
            </div>

            <!-- Search and Controls -->
            <div class="flex items-center gap-4 w-full md:w-auto">
                <!-- Search Bar -->
                <div class="relative w-full md:w-64">
                    <input type="text" id="searchInput" placeholder="ค้นหาเอกสาร..." 
                           class="w-full pl-10 pr-4 py-2 bg-white border-none rounded-full shadow-inner focus:outline-none focus:ring-2 focus:ring-amber-500/50 text-sm transition-shadow">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-clay-400 text-lg"></i>
                </div>

                <!-- Sort Buttons -->
                <div class="hidden sm:flex inline-flex bg-clay-200 rounded-lg p-1 shadow-inner">
                    <button class="px-4 py-1.5 text-sm rounded-md bg-white shadow-sm font-medium text-amber-900">
                        Name <i class="ph ph-caret-up-down ml-1"></i>
                    </button>
                    <button class="px-4 py-1.5 text-sm rounded-md text-clay-600 hover:text-clay-800 font-medium transition-colors">
                        Date <i class="ph ph-caret-up-down ml-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Breadcrumb Navigation -->
    <div class="bg-clay-100/80 border-b border-clay-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5">
            <nav id="breadcrumb-container" class="flex text-sm text-clay-700 font-medium items-center overflow-x-auto whitespace-nowrap hide-scrollbar">
                <!-- Javascript will populate this -->
            </nav>
        </div>
    </div>

    <!-- Main Bookshelf Area -->
    <main class="flex-grow py-8 px-4 sm:px-6 lg:px-8">
        
        <!-- Bookshelf Cabinet Container (3D Inset look) -->
        <div class="max-w-6xl mx-auto bg-clay-50 rounded-2xl shadow-clay-inset p-4 md:p-8 lg:px-16 border border-clay-200 relative overflow-hidden">
            
            <!-- Cabinet inner shadow for depth -->
            <div class="absolute inset-0 pointer-events-none rounded-2xl shadow-[inset_0_10px_30px_rgba(0,0,0,0.05)]"></div>

            <div id="bookshelf-container" class="relative mt-8">
                <!-- The JavaScript will populate shelves here -->
            </div>

        </div>
    </main>

    <footer class="bg-clay-200 py-6 text-center text-clay-600 text-sm">
        <p>© 2026 พัฒนาโดย กลุ่มนโยบายและวิชาการ สนง.พมจ.บึงกาฬ • โทรศัพท์ 042-492463</p>
    </footer>

    <!-- Image Preview Modal -->
    <div id="imageModal" class="fixed inset-0 z-[100] hidden bg-black/70 backdrop-blur-sm transition-opacity duration-300 opacity-0 flex items-center justify-center p-4 sm:p-8">
        <div class="bg-clay-50 rounded-2xl shadow-clay w-full max-w-4xl overflow-hidden flex flex-col relative transform scale-95 transition-transform duration-300" id="modalContent">
            <!-- Header -->
            <div class="px-4 py-3 border-b border-clay-200 flex justify-between items-center bg-white/50">
                <h3 id="modalTitle" class="text-clay-800 font-semibold text-lg truncate pr-4">Preview</h3>
                <button onclick="closePreview()" class="text-clay-500 hover:text-red-500 transition-colors p-1.5 rounded-full hover:bg-clay-200 focus:outline-none">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>
            <!-- Image Container -->
            <div class="bg-gray-200/50 relative flex-grow flex items-center justify-center p-4 min-h-[40vh] md:min-h-[60vh] max-h-[70vh] overflow-hidden">
                <img id="modalImage" src="" alt="Preview" class="max-w-full max-h-full object-contain drop-shadow-md rounded-md">
            </div>
            <!-- Footer Actions -->
            <div class="px-6 py-4 bg-clay-100 flex justify-end gap-3 border-t border-clay-200">
                <button onclick="closePreview()" class="px-4 py-2 text-sm font-medium text-clay-700 bg-white border border-clay-300 rounded-lg hover:bg-clay-50 shadow-sm transition-colors">
                    ปิด
                </button>
                <button id="modalDownloadBtn" class="px-6 py-2 text-sm font-medium text-white bg-gradient-to-r from-amber-600 to-amber-700 rounded-lg shadow-md hover:shadow-lg hover:from-amber-500 hover:to-amber-600 transition-all flex items-center gap-2">
                    <i class="ph-bold ph-download-simple"></i>
                    ดาวน์โหลด
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript for Data and Interactivity -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxIKY34bNjxCkDelWoJsjrXGl8g-d_CMxqp2MLKUymShNHakoPZ7hb4dBWKhVg9NYDQ/exec";

        // Hierarchical Data Structure (Years -> Months -> Days -> Images)
        const mockGalleryData = {
            "2569": {
                "มกราคม": {
                    "05": [
                        { id: 101, title: 'ลงพื้นที่เยี่ยมบ้าน_01', color: '8B4513' },
                        { id: 102, title: 'ลงพื้นที่เยี่ยมบ้าน_02', color: 'A0522D' },
                        { id: 103, title: 'ลงพื้นที่เยี่ยมบ้าน_03', color: 'D2691E' }
                    ],
                    "15": [
                        { id: 104, title: 'ประชุมคณะทำงาน_01', color: '4682B4' },
                        { id: 105, title: 'ประชุมคณะทำงาน_02', color: '5F9EA0' }
                    ]
                },
                "กุมภาพันธ์": {
                    "14": [
                        { id: 201, title: 'กิจกรรมวันแห่งความรัก_01', color: 'C71585' }
                    ]
                }
            },
            "2568": {
                "ธันวาคม": {
                    "25": [
                        { id: 301, title: 'สรุปผลงานสิ้นปี_01', color: '2E8B57' },
                        { id: 302, title: 'สรุปผลงานสิ้นปี_02', color: '3CB371' }
                    ]
                },
                "พฤศจิกายน": {
                    "10": [
                        { id: 401, title: 'มอบถุงยังชีพ_01', color: 'DAA520' }
                    ]
                }
            }
        };

        let currentPath = []; // Tracks navigation state [Year, Month, Day]
        const container = document.getElementById('bookshelf-container');
        const searchInput = document.getElementById('searchInput');
        const itemsPerShelf = 6; 
        let appData = {}; // Will hold fetched or mock data

        // Convert Flat Array (from GAS API) to Nested Object
        function transformFlatToNested(flatData) {
            const result = {};
            const getChildren = (parentId) => flatData.filter(item => item.parentId === parentId);

            const years = getChildren('root');
            years.forEach(yearFolder => {
                result[yearFolder.name] = {};
                
                const months = getChildren(yearFolder.id);
                months.forEach(monthFolder => {
                    result[yearFolder.name][monthFolder.name] = {};
                    
                    const days = getChildren(monthFolder.id);
                    days.forEach(dayFolder => {
                        result[yearFolder.name][monthFolder.name][dayFolder.name] = [];
                        
                        const images = getChildren(dayFolder.id);
                        images.forEach(img => {
                            result[yearFolder.name][monthFolder.name][dayFolder.name].push({
                                id: img.id,
                                title: img.name.replace(/\.[^/.]+$/, ""), // เอาสกุลไฟล์ .jpg ออกเพื่อใช้เป็นชื่อ
                                url: img.url,
                                color: 'A0522D' // สี fallback
                            });
                        });
                    });
                });
            });
            return result;
        }

        async function initData() {
            // แสดง Skeleton Loading ระหว่างรอ API
            container.innerHTML = `
                <div class="text-center py-32 flex flex-col items-center justify-center transition-all duration-300">
                    <i class="ph-bold ph-spinner-gap animate-spin text-5xl text-amber-700/80 mb-4 drop-shadow-sm"></i>
                    <p class="text-clay-600 font-medium animate-pulse text-lg tracking-wide">กำลังดึงข้อมูลเอกสาร...</p>
                </div>
            `;

            // ดึงข้อมูลจาก API หากมีการตั้งค่า URL
            if (API_URL && API_URL !== "ใส่_WEB_APP_URL_ของคุณที่นี่") {
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) throw new Error('Network response was not ok');
                    const flatData = await response.json();
                    appData = transformFlatToNested(flatData);
                } catch (error) {
                    console.error('Fetch API error, fallback to mock data:', error);
                    appData = mockGalleryData;
                }
            } else {
                // ถ้ายังไม่มี API URL ให้ใช้ Mock Data ทดสอบไปก่อน
                // หน่วงเวลาเล็กน้อยให้เห็น Loading state สวยๆ (500ms)
                await new Promise(resolve => setTimeout(resolve, 500)); 
                appData = mockGalleryData;
            }
            
            renderView();
        }

        // Main function to evaluate what to show based on current path
        function renderView() {
            updateBreadcrumbs();
            
            let currentLevelData = appData;
            for (let pathSegment of currentPath) {
                currentLevelData = currentLevelData[pathSegment];
            }

            let itemsToRender = [];

            if (currentPath.length < 3) {
                // We are at Year, Month, or Day level -> Show Folders
                for (let key in currentLevelData) {
                    itemsToRender.push({
                        name: key,
                        isFolder: true,
                        pathValue: key
                    });
                }
            } else {
                // We are at Image level -> Show Images
                itemsToRender = currentLevelData.map(img => ({
                    ...img,
                    isFolder: false
                }));
            }

            // Apply simple local search filtering if needed
            const term = searchInput.value.toLowerCase();
            if (term) {
                itemsToRender = itemsToRender.filter(item => {
                    const searchStr = item.isFolder ? item.name : item.title;
                    return searchStr.toLowerCase().includes(term);
                });
            }

            renderShelves(itemsToRender);
        }

        // Render actual items onto shelves
        function renderShelves(items) {
            container.innerHTML = '';
            
            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-clay-500 font-medium">ไม่พบข้อมูลในหมวดหมู่นี้</div>`;
                return;
            }

            const numShelves = Math.ceil(items.length / itemsPerShelf) || 1;

            for (let i = 0; i < numShelves; i++) {
                const shelfItems = items.slice(i * itemsPerShelf, (i + 1) * itemsPerShelf);
                
                const shelfRow = document.createElement('div');
                shelfRow.className = 'mb-12 relative';

                const itemsContainer = document.createElement('div');
                itemsContainer.className = 'flex flex-wrap justify-center sm:justify-start md:justify-center gap-6 md:gap-10 px-4 items-end pb-[2px] z-20 relative';

                shelfItems.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'group flex flex-col items-center w-28 sm:w-32 md:w-36 transition-all duration-300 transform';
                    
                    if (item.isFolder) {
                        // Render Folder
                        itemEl.innerHTML = `
                            <div class="relative w-full aspect-[1/1.3] cursor-pointer bg-[#e4d9c5] border-l-[12px] border-amber-700/80 rounded-r-md rounded-l-sm shadow-book group-hover:shadow-book-hover group-hover:-translate-y-2 transition-all flex flex-col items-center justify-center z-20" onclick="navigateTo('${item.pathValue}')">
                                <div class="absolute left-0 top-0 bottom-0 w-[2px] bg-black/10"></div>
                                <i class="ph-fill ph-folder text-5xl text-amber-800/70 mb-3 drop-shadow-sm"></i>
                                <h3 class="font-bold text-clay-900 text-center px-2 text-sm md:text-base leading-tight break-words w-full">
                                    ${item.name}
                                </h3>
                            </div>
                            <div class="w-full mt-3 flex justify-center z-30 transition-transform duration-300 opacity-0 group-hover:opacity-100">
                                <span class="text-[11px] font-semibold text-amber-800 bg-amber-100/80 px-3 py-1 rounded-full shadow-sm">เปิดโฟลเดอร์</span>
                            </div>
                        `;
                    } else {
                        // Render JPG Image (Use item.url if available from API, else use placehold)
                        const imgUrl = item.url || `https://placehold.co/400x560/${item.color || 'A0522D'}/ffffff?text=JPG`;
                        itemEl.innerHTML = `
                            <div class="relative w-full aspect-[1/1.3] cursor-pointer bg-white p-1.5 pb-6 rounded-sm shadow-book group-hover:shadow-book-hover group-hover:-translate-y-2 transition-all z-20" onclick="openPreview('${item.title}', '${imgUrl}')">
                                <div class="w-full h-full bg-gray-100 overflow-hidden relative border border-gray-200">
                                    <img src="${imgUrl}" alt="${item.title}" class="w-full h-full object-cover">
                                </div>
                                <div class="absolute bottom-1 left-0 right-0 text-center">
                                    <span class="text-[10px] font-medium text-gray-500 truncate px-1 block">${item.title}.jpg</span>
                                </div>
                            </div>
                            <div class="w-full mt-3 flex justify-center z-30 transition-transform duration-300 group-hover:-translate-y-1">
                                <button onclick="event.stopPropagation(); downloadImage('${item.title}')" 
                                        class="flex items-center justify-center gap-1 w-full max-w-[100px] py-1.5 px-2 bg-gradient-to-b from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white text-xs font-medium rounded-full shadow-md hover:shadow-lg transition-all active:scale-95">
                                    <i class="ph-bold ph-download-simple"></i>
                                    โหลด
                                </button>
                            </div>
                        `;
                    }
                    itemsContainer.appendChild(itemEl);
                });

                const shelfDivider = document.createElement('div');
                shelfDivider.className = 'shelf-divider shadow-shelf w-full';

                shelfRow.appendChild(itemsContainer);
                shelfRow.appendChild(shelfDivider);
                container.appendChild(shelfRow);
            }
        }

        // Navigation Controller
        window.navigateTo = function(target) {
            if (target === 'home') {
                currentPath = [];
            } else if (typeof target === 'number') {
                // Navigate to a specific level via breadcrumb
                currentPath = currentPath.slice(0, target + 1);
            } else {
                // Dive deeper into folder
                currentPath.push(target);
            }
            searchInput.value = ''; // Reset search on navigation
            renderView();
        }

        // Update Breadcrumb UI
        function updateBreadcrumbs() {
            const bc = document.getElementById('breadcrumb-container');
            let html = `<button onclick="navigateTo('home')" class="hover:text-amber-800 transition-colors flex items-center gap-1"><i class="ph-fill ph-house text-lg"></i> หน้าแรก</button>`;
            
            currentPath.forEach((path, index) => {
                html += `<i class="ph-bold ph-caret-right text-clay-400 text-[10px] mx-2"></i>`;
                html += `<button onclick="navigateTo(${index})" class="hover:text-amber-800 transition-colors truncate max-w-[120px] sm:max-w-none">${path}</button>`;
            });
            
            bc.innerHTML = html;
        }

        // Search functionality
        searchInput.addEventListener('input', () => {
            renderView();
        });

        // --- Modal Preview Logic ---
        const modal = document.getElementById('imageModal');
        const modalContent = document.getElementById('modalContent');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalDownloadBtn = document.getElementById('modalDownloadBtn');

        window.openPreview = function(title, imgUrl) {
            modalTitle.innerText = `${title}.jpg`;
            modalImage.src = imgUrl;
            
            // Attach download function to modal button
            modalDownloadBtn.onclick = function(event) {
                downloadImage(title, event);
            };

            // Show Modal
            modal.classList.remove('hidden');
            // Slight delay to allow CSS transitions to trigger
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            
            // Prevent background scrolling
            document.body.style.overflow = 'hidden';
        };

        window.closePreview = function() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            // Hide after animation finishes
            setTimeout(() => {
                modal.classList.add('hidden');
                modalImage.src = '';
                document.body.style.overflow = ''; // Restore scrolling
            }, 300);
        };

        // Close modal when clicking outside of the content
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closePreview();
            }
        });
        // ---------------------------

        // Simulated Image Download Function
        window.downloadImage = function(title, eventObj) {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            
            // Draw a fake image
            ctx.fillStyle = '#f0ebe1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#524941';
            ctx.font = '24px Kanit, Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`ดาวน์โหลดรูปภาพ:`, canvas.width/2, canvas.height/2 - 20);
            ctx.font = 'bold 30px Kanit, Arial';
            ctx.fillText(`${title}.jpg`, canvas.width/2, canvas.height/2 + 20);

            // Trigger download
            const dataUrl = canvas.toDataURL('image/jpeg');
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `${title}_${new Date().getTime()}.jpg`; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            // Visual feedback on button
            const btn = eventObj ? eventObj.currentTarget : (window.event ? window.event.currentTarget : document.getElementById('modalDownloadBtn'));
            
            if (btn) {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="ph-bold ph-check text-green-200"></i> สำเร็จ';
                btn.classList.remove('from-amber-600', 'to-amber-700', 'hover:from-amber-500', 'hover:to-amber-600');
                btn.classList.add('from-green-600', 'to-green-700');
                
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.remove('from-green-600', 'to-green-700');
                    btn.classList.add('from-amber-600', 'to-amber-700', 'hover:from-amber-500', 'hover:to-amber-600');
                }, 2000);
            }
        }

        // Initialize App with Fetch
        initData();

    </script>
</body>
</html>
